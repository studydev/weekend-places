name: 장소 데이터 검사
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  places:
    name: 장소 데이터 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/check-places.mjs
